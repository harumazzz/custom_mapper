version: 0.0.1
homepage: https://github.com/harumazzz/custom_mapper
repository: https://github.com/harumazzz/custom_mapper
issue_tracker: https://github.com/harumazzz/custom_mapper/issues

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  custom_mapper_annotation: ^0.0.1
  analyzer: ">=6.4.1 <7.0.0"
  build: ^2.4.1
  source_gen: ^1.5.0
  collection: ^1.18.0

dev_dependencies:
