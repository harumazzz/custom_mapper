name: custom_mapper
description: "A powerful code generation package for creating type-safe mappers between domain objects and data transfer objects (DTOs) in Dart and Flutter applications."
version: 0.0.2
homepage: https://github.com/harumazzz/custom_mapper
repository: https://github.com/harumazzz/custom_mapper
issue_tracker: https://github.com/harumazzz/custom_mapper/issues

environment:
  sdk: ">=3.8.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  custom_mapper_annotation: ^0.0.1
  analyzer: ">=6.4.1 <10.0.0"
  build: ">=2.4.1 <5.0.0"
  source_gen: ">=1.5.0 <5.0.0"
  collection: ^1.18.0

dev_dependencies:
  build_runner: ^2.4.13

topics:
  - codegen
  - mapper
  - dto
  - code-generation
  - build-runner

flutter:
